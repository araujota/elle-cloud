# ELLE Cloud - One-Command Org Vault Deployment
#
# Quick Start:
#   1. docker compose run --rm elle-cloud init-certs --org-name "my-org"
#   2. docker compose up -d
#   3. docker compose run --rm elle-cloud issue-client-cert --installation-id "workstation-01"
#
# The vault is now ready at https://localhost:8443

version: '3.8'

services:
  elle-cloud:
    build: .
    image: elle-cloud:latest
    container_name: elle-cloud
    environment:
      # Deployment mode: "org" for self-hosted, "global" for Anthropic cloud
      ELLE_CLOUD_MODE: ${ELLE_CLOUD_MODE:-org}

      # Organization name (used in certificates and tenant isolation)
      ELLE_CLOUD_ORG_NAME: ${ELLE_CLOUD_ORG_NAME:-my-org}

      # Logging configuration
      ELLE_CLOUD_LOG_LEVEL: ${ELLE_CLOUD_LOG_LEVEL:-info}
      ELLE_CLOUD_LOG_FORMAT: ${ELLE_CLOUD_LOG_FORMAT:-json}

      # mTLS authentication (set to false for testing only)
      ELLE_CLOUD_REQUIRE_CLIENT_CERT: ${ELLE_CLOUD_REQUIRE_CLIENT_CERT:-true}

    ports:
      # mTLS API port
      - "${ELLE_CLOUD_PORT:-8443}:8443"
      # Health check port (optional, for monitoring)
      - "${ELLE_CLOUD_HEALTH_PORT:-8080}:8080"

    volumes:
      # Persistent storage for SQLite database
      - elle-data:/data

      # Certificate storage (mount your certs here)
      - ./certs:/certs:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

    # Resource limits (adjust for your deployment)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  elle-data:
    driver: local

# Optional: Network configuration for production
networks:
  default:
    name: elle-cloud-network
